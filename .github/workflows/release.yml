name: Publish and Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  NODE_VERSION: 24

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    name: Publish and Release
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # CHANGELOG の差分を適切に生成するため明示的にすべての履歴を取得
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Prepare
        run: |
          npm ci
          npm run setup
          npm run build
          npm test
      - name: Create Release PullRequest or Publish
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          publish: npm run release-packages
          version: npm run version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Archive artifact
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shrinkwrap_log
          path: ./logs_shrinkwrap
      - name: Push tag after publish
        # checkout の persist-credentials: false で認証情報が消されるので設定し処理後に削除
        run: |
          if [[ `find ./packages/**/npm-shrinkwrap.json` ]]; then
            VERSION=`jq -r .version packages/akashic-cli/package.json`
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}"
            git config user.name 'github-actions'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

            git checkout -b tag_$VERSION
            git add './packages/**/npm-shrinkwrap.json'
            git commit -m "Add tag after published $VERSION"
            git tag -a v$VERSION -m "tag $VERSION"
            git push origin v$VERSION

            git remote rm origin
            git config unset user.name
            git config unset user.email
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Test after publish
        # package-lock.json を更新するのが publish 直前のため、publish した物と完全に同じ状態でテストできない
        # ここでエラーになっても既に publish してしまった後だが、問題の検出を早めるため実行している
        # モノレポでインストールしたルートの node_modules と npm-shrinkwrap.json 作成時にインストールした各パッケージの node_modules が原因なのか、
        # 各パッケージのテストがおかしな挙動で失敗する。そのため e2e テストを実行
        # publish 時に npm-shrinkwrap.json が作成されていなければエラーとなり、このテストは実行されない
        run: | 
          if [[ `find ./packages/**/npm-shrinkwrap.json` ]]; then
            npm run test:e2e
          fi
