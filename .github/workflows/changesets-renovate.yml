name: Generate changeset for Renovate

on:
  pull_request:
    paths:
      - '.github/workflows/changesets-renovate.yml'
      - '**/package-lock.json'
      - '**/package.json'

env:
  NODE_VERSION: 24

permissions:
  contents: write

jobs:
  generate-changeset:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'renovate[bot]' && github.repository == 'akashic-games/akashic-cli' && contains(github.event.pull_request.labels.*.name, 'release')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          ref: ${{ github.head_ref }}
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Run changesets-renovate
        run: |
          git config user.name 'github-actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npm install --global @scaleway/changesets-renovate
          changesets-renovate
